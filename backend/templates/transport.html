<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>__APP_NAME__</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#0f0f1e;--surface:#1a1a2e;--surface2:#16213e;--accent:#e94560;--fg:#f5f5f5;--fg2:#a3a3c2;--fg3:#6b6b8a;--green:#16a34a;--purple:#a855f7;--gold:#facc15;--radius:14px;--font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5;overflow:hidden}
body{display:flex;flex-direction:column;height:100vh;height:100dvh}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;padding-top:max(14px,env(safe-area-inset-top));background:linear-gradient(135deg,#1a1a2e,#16213e);border-bottom:1px solid rgba(233,69,96,.2);flex-shrink:0}
.topbar-title{flex:1;text-align:center;font-size:17px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 12px}
.topbar-icons{display:flex;align-items:center;gap:8px}
.icon-btn{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);-webkit-user-select:none;user-select:none}
.icon-btn:active{transform:scale(.92)}
.icon-btn svg{width:20px;height:20px;fill:currentColor}
.icon-btn.whatsapp{color:#25D366;background:rgba(37,211,102,.12);border-color:rgba(37,211,102,.3)}
.icon-btn.privacy{color:#58a6ff;background:rgba(88,166,255,.12);border-color:rgba(88,166,255,.3)}
.icon-btn.rate{color:#facc15;background:rgba(250,204,21,.12);border-color:rgba(250,204,21,.3)}
/* Tab bar for switching between datasets */
.tab-bar{display:flex;gap:4px;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.tab-btn{flex-shrink:0;padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--fg2);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .15s;-webkit-user-select:none;user-select:none}
.tab-btn:active{transform:scale(.95)}
.tab-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.search-bar{padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
.search-bar input{width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--border);border-radius:8px;padding:10px 14px;font-size:13px;font-family:inherit}
.search-bar input:focus{outline:none;border-color:var(--accent)}
.stats-bar{display:flex;gap:8px;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto}
.stat-pill{background:var(--surface2);padding:4px 12px;border-radius:12px;font-size:11px;color:var(--fg2);white-space:nowrap;display:flex;align-items:center;gap:4px}
.stat-pill b{color:var(--accent)}
.list-container{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:8px 12px}
.section-header{padding:12px 4px 6px;font-size:11px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.5px;position:sticky;top:0;background:var(--bg);z-index:5}
.item-card{display:flex;align-items:center;gap:12px;padding:12px;background:var(--surface);border-radius:10px;margin-bottom:6px;border:1px solid transparent;transition:all .15s}
.item-card:active{background:var(--surface2);border-color:var(--accent)}
.item-icon{width:44px;height:44px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:22px;background:rgba(233,69,96,.15)}
.item-info{flex:1;min-width:0}
.item-name{font-size:13px;font-weight:600;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-meta{font-size:11px;color:var(--fg2);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
.item-meta .price{color:var(--green);font-weight:600;font-family:monospace}
.item-meta .tag{color:var(--accent);font-size:10px}
.item-meta .status{padding:1px 6px;border-radius:4px;font-size:10px;font-weight:600}
.item-meta .status.ok{background:rgba(22,163,74,.2);color:var(--green)}
.item-meta .status.warn{background:rgba(250,204,21,.2);color:var(--gold)}
.item-meta .status.crit{background:rgba(248,81,73,.2);color:#f85149}
.empty{text-align:center;padding:60px 20px;color:var(--fg3)}
.empty p{font-size:14px}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:999;display:none;flex-direction:column}
.viewer.show{display:flex}
.viewer-header{display:flex;align-items:center;gap:12px;padding:14px 16px;padding-top:max(14px,env(safe-area-inset-top));background:rgba(0,0,0,.8);color:#fff}
.viewer-title{flex:1;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.close-btn{width:36px;height:36px;border-radius:50%;border:none;background:rgba(255,255,255,.15);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
.close-btn svg{width:20px;height:20px;fill:currentColor}
.viewer-body{flex:1;overflow:auto;padding:16px;background:#000}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.detail-field{background:var(--surface);padding:10px 12px;border-radius:8px;border:1px solid var(--border)}
.detail-field .label{font-size:10px;color:var(--fg3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.detail-field .value{font-size:13px;color:var(--fg);font-weight:500;word-break:break-word}
.detail-field .value.accent{color:var(--accent)}
.detail-field .value.green{color:var(--green)}
.detail-field .value.full{grid-column:1/-1}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;z-index:1000;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:20px;z-index:998}
.modal.show{display:flex}
.modal-content{background:var(--surface);border-radius:14px;max-width:500px;width:100%;max-height:80vh;overflow-y:auto;padding:24px;border:1px solid rgba(255,255,255,.1)}
.modal-content h2{color:var(--accent);margin-bottom:12px;font-size:18px}
.modal-content p{color:var(--fg2);font-size:13px;line-height:1.7;margin-bottom:10px}
.modal-close{display:block;margin:20px auto 0;padding:10px 24px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}
</style>
<script>const WHATSAPP_CHANNEL_URL='https://whatsapp.com/channel/0029VaijFIC5Ejxq4oG6wX0E';</script></head>

<script>
const APP_CONFIG = __APP_CONFIG__;
const APP_NAME = "__APP_NAME__";
const GENERATED_DATE = "__GENERATED_DATE__";
const PRIVACY_URL = "__PRIVACY_URL__";
const RATE_URL = "__RATE_URL__";
const WHATSAPP_NUMBER = "__WHATSAPP_NUMBER__";
const MEDIA_BUNDLE = __MEDIA_BUNDLE__;

// Datasets extracted from loaded files
// Each dataset = { name: "patients", icon: "👥", items: [...] }
let datasets = [];
let activeDataset = 0;

function escapeHtml(s){return(s==null?"":String(s)).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c])}

// Smart JSON parser — handles multiple structures:
// 1. Flat array: [{...}, {...}] → one dataset "Records"
// 2. Nested {data: {patients: [...], doctors: [...]}} → multiple datasets
// 3. {project: "...", data: {...}} → uses project name as app title
// 4. CSV text → parsed into array
// 5. Plain text lines → array of {name: line}
function parseFileContent(name, content) {
  const ext = (name.match(/\.([a-z0-9]+)$/i)||[,''])[1].toLowerCase();
  if (ext === 'json') {
    try {
      const data = JSON.parse(content);
      return extractDatasets(data, name);
    } catch(e) { return []; }
  }
  if (ext === 'csv') { return [{name:'Data', icon:'📊', items: parseCSV(content)}]; }
  if (ext === 'txt') { return [{name:'Contacts', icon:'📝', items: content.split('\n').filter(l=>l.trim()).map(l=>{const p=l.match(/^(.+?):\s*(.+)$/);return p?{name:p[1].trim(),phone:p[2].trim()}:{name:l.trim()}})}]; }
  if (ext === 'html' || ext === 'htm') { return [{name:'Page', icon:'📄', items:[{name:name, content:content, type:'html'}]}]; }
  return [];
}

function extractDatasets(data, fileName) {
  const result = [];
  const icons = {patients:'👥', doctors:'🩺', nurses:'💉', appointments:'📅', rooms:'🛏️', medicines:'💊', invoices:'💰', emergency:'🚨', beds:'🛏️', revenue:'📊', operations:'📊', products:'📦', items:'📦', records:'📋', contacts:'📞', services:'🔧', staff:'👨‍⚕️'};

  // Case 1: Flat array
  if (Array.isArray(data)) {
    return [{name: fileName.replace(/\.[^.]+$/, ''), icon: '📋', items: data}];
  }

  // Case 2: Has "data" key with sub-arrays
  if (data.data && typeof data.data === 'object') {
    for (const [key, val] of Object.entries(data.data)) {
      if (Array.isArray(val) && val.length > 0) {
        result.push({
          name: key.charAt(0).toUpperCase() + key.slice(1),
          icon: icons[key] || '📋',
          items: val
        });
      }
    }
    if (result.length > 0) return result;
  }

  // Case 3: Object with array values (no "data" wrapper)
  for (const [key, val] of Object.entries(data)) {
    if (Array.isArray(val) && val.length > 0 && typeof val[0] === 'object') {
      result.push({
        name: key.charAt(0).toUpperCase() + key.slice(1),
        icon: icons[key] || '📋',
        items: val
      });
    }
  }
  if (result.length > 0) return result;

  // Case 4: Single object (not an array) → wrap as one item
  return [{name: fileName.replace(/\.[^.]+$/, ''), icon: '📋', items: [data]}];
}

function parseCSV(text) {
  const lines = text.trim().split('\n');
  if (lines.length < 2) return [];
  const headers = lines[0].split(',').map(h => h.trim());
  return lines.slice(1).map(line => {
    const vals = line.split(',');
    const obj = {};
    headers.forEach((h, i) => obj[h] = (vals[i]||'').trim());
    return obj;
  });
}

let appConfig = null;
let appStrings = null;

function loadConfigAndStrings() {
  // Try to load config.json (generated by data_analyzer)
  try {
    const xhr = new XMLHttpRequest();
    xhr.open('GET', 'file:///android_asset/webapp/config.json', false);
    xhr.send();
    if (xhr.status === 200 || xhr.status === 0) {
      appConfig = JSON.parse(xhr.responseText);
      console.log('config.json loaded:', appConfig.total_fields, 'fields,', appConfig.total_datasets, 'datasets');
    }
  } catch(e) { console.log('config.json not available'); }
  // Try to load strings.json (generated by data_analyzer)
  try {
    const xhr2 = new XMLHttpRequest();
    xhr2.open('GET', 'file:///android_asset/webapp/strings.json', false);
    xhr2.send();
    if (xhr2.status === 200 || xhr2.status === 0) {
      appStrings = JSON.parse(xhr2.responseText);
      console.log('strings.json loaded:', appStrings.summary.total_strings, 'strings,', appStrings.summary.total_ids, 'IDs');
    }
  } catch(e) { console.log('strings.json not available'); }
}

function loadAllData() {
  // Load config + strings first
  loadConfigAndStrings();
  
  const files = MEDIA_BUNDLE.files || [];
  for (const f of files) {
    const name = f.originalName || f.path || '';
    const ext = (name.match(/\.([a-z0-9]+)$/i)||[,''])[1].toLowerCase();
    if (['json','csv','txt','html','htm'].includes(ext)) {
      const url = f.url || ('file:///android_asset/webapp/media/' + (f.path || name));
      try {
        const xhr = new XMLHttpRequest();
        xhr.open('GET', url, false);
        xhr.send();
        if (xhr.status === 200 || xhr.status === 0) {
          const parsed = parseFileContent(name, xhr.responseText);
          for (const ds of parsed) { datasets.push(ds); }
        }
      } catch(e) { console.warn('Cannot load ' + name + ': ' + e); }
    }
  }
  // If no datasets loaded, create an empty one
  if (datasets.length === 0) {
    datasets.push({name: 'No Data', icon: '📭', items: []});
  }
}

function renderTabs() {
  const bar = document.getElementById('tabBar');
  bar.innerHTML = datasets.map((ds, i) => {
    return '<button class="tab-btn ' + (i === activeDataset ? 'active' : '') + '" onclick="switchTab(' + i + ')">' +
      ds.icon + ' ' + escapeHtml(ds.name) + ' (' + ds.items.length + ')</button>';
  }).join('');
}

function switchTab(i) {
  activeDataset = i;
  renderTabs();
  renderItems();
}

function getGroupField(items) {
  if (items.length === 0) return null;
  const sample = items[0];
  // Priority fields for grouping
  const priorities = ['department', 'dept', 'specialty', 'category', 'type', 'status', 'gender', 'floor', 'severity', 'brand'];
  for (const p of priorities) {
    if (sample[p] !== undefined) return p;
  }
  return null;
}

function getNameField(item) {
  const nameFields = ['name', 'patient', 'doctor', 'title', 'product', 'medicine_name', 'item'];
  for (const f of nameFields) { if (item[f] !== undefined) return f; }
  // Fallback: first string field
  for (const [k, v] of Object.entries(item)) { if (typeof v === 'string') return k; }
  return Object.keys(item)[0] || 'name';
}

function getStatusClass(val) {
  const v = String(val).toLowerCase();
  if (/مستقر|ok|paid|available|مدفوعة|متاح|مؤكد/.test(v)) return 'ok';
  if (/متابعة|warn|pending|قيد|يحتاج|متوسط/.test(v)) return 'warn';
  if (/حرج|crit|urgent|عاجل/.test(v)) return 'crit';
  return '';
}

function renderItems() {
  const ds = datasets[activeDataset];
  if (!ds) return;
  const filter = (document.getElementById('searchInput').value || '').toLowerCase();
  let items = ds.items;
  if (filter) {
    items = items.filter(i => JSON.stringify(i).toLowerCase().includes(filter));
  }
  document.getElementById('statTotal').textContent = items.length;

  // Update stats bar
  const statsBar = document.getElementById('statsBar');
  const groupField = getGroupField(items);
  if (groupField) {
    const groups = new Set(items.map(i => i[groupField]).filter(v => v != null));
    statsBar.innerHTML = '<div class="stat-pill">Total: <b>' + items.length + '</b></div>' +
      '<div class="stat-pill">Groups: <b>' + groups.size + '</b></div>';
  } else {
    statsBar.innerHTML = '<div class="stat-pill">Total: <b>' + items.length + '</b></div>';
  }

  const list = document.getElementById('itemList');
  if (items.length === 0) {
    list.innerHTML = '<div class="empty"><p>No items found</p></div>';
    return;
  }

  // Group items
  const groups = {};
  if (groupField) {
    items.forEach(i => {
      const g = i[groupField] || 'Other';
      if (!groups[g]) groups[g] = [];
      groups[g].push(i);
    });
  } else {
    groups['All'] = items;
  }

  let html = '';
  for (const [groupName, groupItems] of Object.entries(groups)) {
    html += '<div class="section-header">' + escapeHtml(groupName) + ' (' + groupItems.length + ')</div>';
    for (const item of groupItems) {
      const nameField = getNameField(item);
      const name = item[nameField] || 'Unknown';
      // Show up to 3 metadata fields
      const metaFields = Object.keys(item).filter(k => k !== nameField).slice(0, 3);
      let metaHtml = '';
      for (const mf of metaFields) {
        const val = item[mf];
        if (val == null || val === '') continue;
        if (mf === 'price' || mf === 'fee' || mf === 'cost' || mf === 'service_cost') {
          metaHtml += '<span class="price">' + escapeHtml(String(val)) + '</span>';
        } else if (mf === 'status' || mf === 'severity') {
          metaHtml += '<span class="status ' + getStatusClass(val) + '">' + escapeHtml(String(val)) + '</span>';
        } else {
          metaHtml += '<span class="tag">' + escapeHtml(String(val)) + '</span>';
        }
      }
      // Store item index for click handler
      const itemIdx = ds.items.indexOf(item);
      html += '<div class="item-card" onclick="viewItem(' + activeDataset + ',' + itemIdx + ')">' +
        '<div class="item-icon">' + ds.icon + '</div>' +
        '<div class="item-info">' +
          '<div class="item-name">' + escapeHtml(String(name)) + '</div>' +
          '<div class="item-meta">' + metaHtml + '</div>' +
        '</div>' +
      '</div>';
    }
  }
  list.innerHTML = html;
}

function viewItem(dsIdx, itemIdx) {
  const ds = datasets[dsIdx];
  if (!ds) return;
  const item = ds.items[itemIdx];
  if (!item) return;
  const nameField = getNameField(item);
  document.getElementById('viewerTitle').textContent = item[nameField] || 'Detail';

  let html = '<div class="detail-grid">';
  for (const [k, v] of Object.entries(item)) {
    let valClass = '';
    if (k === 'price' || k === 'fee' || k === 'cost' || k === 'service_cost') valClass = 'green';
    else if (k === 'phone' || k === 'id' || k === 'patient_id') valClass = 'accent';
    html += '<div class="detail-field"><div class="label">' + escapeHtml(k) + '</div>' +
      '<div class="value ' + valClass + '">' + escapeHtml(String(v)) + '</div></div>';
  }
  html += '</div>';
  document.getElementById('viewerBody').innerHTML = html;
  document.getElementById('viewer').classList.add('show');
}

function closeViewer() { document.getElementById('viewer').classList.remove('show'); document.getElementById('viewerBody').innerHTML = ''; }
function shareWhatsApp(){const t=encodeURIComponent('Check out '+APP_NAME+'!');const u=WHATSAPP_NUMBER&&WHATSAPP_NUMBER!=='__WHATSAPP_NUMBER__'?'https://wa.me/'+WHATSAPP_NUMBER+'?text='+t:'https://wa.me/?text='+t;window.open(u,'_blank');}
function rateApp(){if(RATE_URL&&RATE_URL!=='__RATE_URL__')window.open(RATE_URL,'_blank');else showToast('Rating coming soon!');}
function openPrivacy(){if(PRIVACY_URL&&PRIVACY_URL!=='__PRIVACY_URL__')window.open(PRIVACY_URL,'_blank');else document.getElementById('privacyModal').classList.add('show');}
function closePrivacy(){document.getElementById('privacyModal').classList.remove('show');}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}

files.forEach(f => { if (!f.url && (f.path || f.originalName)) f.url = 'file:///android_asset/webapp/media/' + (f.path || f.originalName); });

renderItems();
console.log(APP_NAME + ' loaded - ' + datasets.length + ' datasets, ' + datasets.reduce((s,d)=>s+d.items.length,0) + ' total items' + (appConfig ? ', config: ' + appConfig.total_fields + ' fields' : ''));

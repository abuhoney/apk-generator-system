<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f0f1e">
<title>__APP_NAME__</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0f0f1e;--surface:#1a1a2e;--surface2:#16213e;--accent:#e94560;
  --fg:#f5f5f5;--fg2:#a3a3c2;--fg3:#6b6b8a;
  --green:#16a34a;--purple:#a855f7;--gold:#facc15;
  --radius:14px;
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:var(--font);
  font-size:14px;line-height:1.5;overflow:hidden}
body{display:flex;flex-direction:column;height:100vh;height:100dvh}
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;padding-top:max(14px,env(safe-area-inset-top));
  background:linear-gradient(135deg,#1a1a2e,#16213e);
  border-bottom:1px solid rgba(233,69,96,.2);flex-shrink:0;
}
.topbar-title{flex:1;text-align:center;font-size:17px;font-weight:700;color:#fff;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 12px;}
.topbar-icons{display:flex;align-items:center;gap:8px}
.icon-btn{width:38px;height:38px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;
  border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);
  -webkit-user-select:none;user-select:none;}
.icon-btn:active{transform:scale(.92)}
.icon-btn svg{width:20px;height:20px;fill:currentColor}
.icon-btn.whatsapp{color:#25D366;background:rgba(37,211,102,.12);border-color:rgba(37,211,102,.3)}
.icon-btn.privacy{color:#58a6ff;background:rgba(88,166,255,.12);border-color:rgba(88,166,255,.3)}
.icon-btn.rate{color:#facc15;background:rgba(250,204,21,.12);border-color:rgba(250,204,21,.3)}
.search-bar{padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;}
.search-bar input{width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--border);
  border-radius:8px;padding:10px 14px;font-size:13px;font-family:inherit;}
.search-bar input:focus{outline:none;border-color:var(--accent)}
.file-list-container{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:8px 12px;}
.file-group-header{padding:12px 4px 6px;font-size:11px;font-weight:600;color:var(--fg2);
  text-transform:uppercase;letter-spacing:.5px;position:sticky;top:0;background:var(--bg);z-index:5;}
.file-item{display:flex;align-items:center;gap:12px;padding:12px;background:var(--surface);
  border-radius:10px;margin-bottom:6px;cursor:pointer;transition:all .15s;border:1px solid transparent;}
.file-item:active{background:var(--surface2);border-color:var(--accent);transform:scale(.99)}
.file-icon{width:40px;height:40px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:22px;}
.file-icon.audio{background:rgba(233,69,96,.15)}
.file-icon.video{background:rgba(168,85,247,.15)}
.file-icon.image{background:rgba(22,163,74,.15)}
.file-icon.text{background:rgba(88,166,255,.15)}
.file-icon.pdf{background:rgba(248,81,73,.15)}
.file-icon.archive{background:rgba(250,204,21,.15)}
.file-icon.doc{background:rgba(59,130,246,.15)}
.file-icon.binary{background:rgba(107,107,138,.15)}
.file-info{flex:1;min-width:0}
.file-name{font-size:13px;font-weight:600;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.file-meta{font-size:11px;color:var(--fg2);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;}
.file-meta .size{color:var(--fg3)}
.file-meta .type{color:var(--accent);font-family:monospace;font-size:10px}
.file-actions{display:flex;gap:6px;flex-shrink:0;}
.file-action-btn{width:34px;height:34px;border-radius:50%;border:none;background:rgba(255,255,255,.08);
  color:var(--fg);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;}
.file-action-btn:active{background:var(--accent);color:#fff}
.file-action-btn svg{width:16px;height:16px;fill:currentColor}
.stats-bar{display:flex;gap:8px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto;}
.stat-pill{background:var(--surface2);padding:4px 12px;border-radius:12px;font-size:11px;color:var(--fg2);white-space:nowrap;display:flex;align-items:center;gap:4px;}
.stat-pill b{color:var(--accent)}
.empty{text-align:center;padding:60px 20px;color:var(--fg3);}
.empty p{font-size:14px}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:999;display:none;flex-direction:column;}
.viewer.show{display:flex}
.viewer-header{display:flex;align-items:center;gap:12px;padding:14px 16px;padding-top:max(14px,env(safe-area-inset-top));background:rgba(0,0,0,.8);color:#fff;}
.viewer-title{flex:1;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.close-btn{width:36px;height:36px;border-radius:50%;border:none;background:rgba(255,255,255,.15);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.close-btn svg{width:20px;height:20px;fill:currentColor}
.viewer-body{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;background:#000;position:relative;-webkit-overflow-scrolling:touch;}
.viewer-body img{max-width:100%;max-height:100%;object-fit:contain}
.viewer-body video{max-width:100%;max-height:100%}
.viewer-body audio{width:90%;max-width:500px}
.viewer-body pre{width:100%;height:100%;background:#1a1a2e;color:#e6edf3;padding:16px;font-family:'SF Mono',Consolas,monospace;font-size:12px;white-space:pre-wrap;word-break:break-all;overflow:auto;}
.viewer-body iframe{width:100%;height:100%;border:none;}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;z-index:1000;opacity:0;pointer-events:none;transition:opacity .2s;}
.toast.show{opacity:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:20px;z-index:998;}
.modal.show{display:flex}
.modal-content{background:var(--surface);border-radius:14px;max-width:500px;width:100%;max-height:80vh;overflow-y:auto;padding:24px;border:1px solid rgba(255,255,255,.1);}
.modal-content h2{color:var(--accent);margin-bottom:12px;font-size:18px}
.modal-content p{color:var(--fg2);font-size:13px;line-height:1.7;margin-bottom:10px}
.modal-close{display:block;margin:20px auto 0;padding:10px 24px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;}
</style>
<script>const WHATSAPP_CHANNEL_URL='https://whatsapp.com/channel/0029VaijFIC5Ejxq4oG6wX0E';</script></head>
<body>
<div class="topbar">
  <div class="topbar-icons">
    <div class="icon-btn whatsapp" onclick="shareWhatsApp()" title="Share via WhatsApp">
      <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.149-.197.297-.767.967-.94 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.074-.149-.669-1.611-.916-2.207-.242-.579-.487-.5-.669-.51l-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.71.306 1.263.489 1.694.625.712.227 1.36.195 1.872.118.571-.085 1.758-.719 2.006-1.413.247-.694.247-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
    </div>
  </div>
  <div class="topbar-title" id="appTitle">__APP_NAME__</div>
  <div class="topbar-icons">
    <div class="icon-btn rate" onclick="rateApp()" title="Rate App">
      <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
    </div>
    <div class="icon-btn privacy" onclick="openPrivacy()" title="Privacy Policy">
      <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/></svg>
    </div>
  </div>
</div>
<div class="stats-bar" id="statsBar">
  <div class="stat-pill">Files: <b id="statTotal">0</b></div>
  <div class="stat-pill">Size: <b id="statSize">0 B</b></div>
</div>
<div class="search-bar">
  <input type="text" id="searchInput" placeholder="Search files..." oninput="filterFiles()">
</div>
<div class="file-list-container" id="fileList"></div>
<div class="viewer" id="viewer">
  <div class="viewer-header">
    <button class="close-btn" onclick="closeViewer()">
      <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
    </button>
    <div class="viewer-title" id="viewerTitle">-</div>
  </div>
  <div class="viewer-body" id="viewerBody"></div>
</div>
<div class="modal" id="privacyModal">
  <div class="modal-content">
    <h2>Privacy Policy</h2>
    <p><strong>__APP_NAME__</strong> respects your privacy.</p>
    <p>This app stores files locally on your device for offline access. No personal data is collected.</p>
    <p style="font-size:11px;color:var(--fg3);margin-top:16px">Last updated: __GENERATED_DATE__</p>
    <button class="modal-close" onclick="closePrivacy()">Close</button>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const MEDIA_BUNDLE = __MEDIA_BUNDLE__;
const APP_NAME = "__APP_NAME__";
const GENERATED_DATE = "__GENERATED_DATE__";
const PRIVACY_URL = "__PRIVACY_URL__";
const RATE_URL = "__RATE_URL__";
const WHATSAPP_NUMBER = "__WHATSAPP_NUMBER__";
let files = MEDIA_BUNDLE.files || [];
function fmtSize(b){if(!b)return "0 B";if(b<1024)return b+" B";if(b<1024*1024)return (b/1024).toFixed(1)+" KB";return (b/1024/1024).toFixed(1)+" MB";}
function escapeHtml(s){return (s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);}
function getFileExt(name){const m=name.match(/\.([a-z0-9]+)$/i);return m?m[1].toLowerCase():'';}
function getFileCategory(file){
  const ext=getFileExt(file.originalName||file.title||'');
  const mime=file.mime||'';
  if(/^(mp3|wav|ogg|m4a|aac|flac|opus|wma)$/.test(ext)||/^audio\//.test(mime))return 'audio';
  if(/^(mp4|mkv|webm|mov|avi|flv|wmv|m4v|3gp)$/.test(ext)||/^video\//.test(mime))return 'video';
  if(/^(jpe?g|png|gif|webp|bmp|svg|heic)$/.test(ext)||/^image\//.test(mime))return 'image';
  if(/^(pdf)$/.test(ext)||mime==='application/pdf')return 'pdf';
  if(/^(txt|md|csv|json|xml|html?|css|js|yaml|yml|log|ini|conf)$/.test(ext)||/^text\//.test(mime))return 'text';
  if(/^(doc|docx|rtf)$/.test(ext))return 'doc';
  if(/^(xls|xlsx)$/.test(ext))return 'spreadsheet';
  if(/^(ppt|pptx)$/.test(ext))return 'presentation';
  if(/^(zip|rar|7z|tar|gz|bz2)$/.test(ext))return 'archive';
  return 'binary';
}
function getFileIcon(cat){const i={audio:'🎵',video:'🎬',image:'🖼️',pdf:'📄',text:'📝',doc:'📃',spreadsheet:'📊',presentation:'📑',archive:'📦',binary:'📎'};return i[cat]||'📎';}
function getFileUrl(file){return file.url||('file:///android_asset/webapp/media/'+(file.path||file.originalName));}
function updateStats(){
  let total=files.length,totalSize=0,audio=0,video=0,image=0,doc=0;
  for(const f of files){totalSize+=f.size||0;const cat=getFileCategory(f);
    if(cat==='audio')audio++;else if(cat==='video')video++;else if(cat==='image')image++;
    else if(['pdf','text','doc','spreadsheet','presentation'].includes(cat))doc++;}
  document.getElementById('statTotal').textContent=total;
  document.getElementById('statSize').textContent=fmtSize(totalSize);
}
function renderFiles(filter){
  const list=document.getElementById('fileList');
  filter=(filter||'').toLowerCase();
  let filtered=filter?files.filter(f=>(f.title||f.originalName||'').toLowerCase().includes(filter)):files;
  if(filtered.length===0){list.innerHTML='<div class="empty"><p>No files found</p></div>';return;}
  const groups={};
  for(const f of filtered){const cat=getFileCategory(f);if(!groups[cat])groups[cat]=[];groups[cat].push(f);}
  const labels={audio:'Audio',video:'Video',image:'Images',pdf:'PDF',text:'Text',doc:'Documents',spreadsheet:'Spreadsheets',presentation:'Presentations',archive:'Archives',binary:'Other'};
  const order=['audio','video','image','pdf','text','doc','spreadsheet','presentation','archive','binary'];
  let html='';
  for(const cat of order){if(!groups[cat])continue;
    html+='<div class="file-group-header">'+labels[cat]+' ('+groups[cat].length+')</div>';
    for(const f of groups[cat]){
      const url=getFileUrl(f);const name=f.title||f.originalName||'Unknown';
      html+='<div class="file-item" onclick="openFile(\''+escapeHtml(name)+'\',\''+cat+'\',\''+escapeHtml(url)+'\')">'+
        '<div class="file-icon '+cat+'">'+getFileIcon(cat)+'</div>'+
        '<div class="file-info"><div class="file-name">'+escapeHtml(name)+'</div>'+
        '<div class="file-meta"><span class="size">'+fmtSize(f.size||0)+'</span><span class="type">'+escapeHtml(f.mime||'')+'</span></div></div>'+
        '<div class="file-actions"><button class="file-action-btn" onclick="event.stopPropagation();downloadFile(\''+escapeHtml(url)+'\',\''+escapeHtml(name)+'\')" title="Download">'+
        '<svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg></button></div></div>';
    }}
  list.innerHTML=html;
}
function openFile(name,cat,url){
  document.getElementById('viewerTitle').textContent=name;
  const body=document.getElementById('viewerBody');
  if(cat==='image')body.innerHTML='<img src="'+url+'" alt="'+escapeHtml(name)+'">';
  else if(cat==='video')body.innerHTML='<video src="'+url+'" controls autoplay></video>';
  else if(cat==='audio')body.innerHTML='<audio src="'+url+'" controls autoplay></audio>';
  else if(cat==='pdf')body.innerHTML='<iframe src="'+url+'" type="application/pdf"></iframe>';
  else if(cat==='text'){fetch(url).then(r=>r.text()).then(t=>{body.innerHTML='<pre>'+escapeHtml(t)+'</pre>';}).catch(()=>{body.innerHTML='<pre>Cannot load: '+escapeHtml(url)+'</pre>';});}
  else body.innerHTML='<div style="text-align:center;padding:40px;color:#fff"><div style="font-size:48px;margin-bottom:16px">'+getFileIcon(cat)+'</div><p style="font-size:14px;margin-bottom:20px">'+escapeHtml(name)+'</p><p style="font-size:12px;color:#aaa;margin-bottom:24px">This file type cannot be previewed inline.</p><a href="'+url+'" download="'+escapeHtml(name)+'" style="display:inline-block;padding:12px 24px;background:#e94560;color:#fff;border-radius:8px;text-decoration:none;font-weight:600">Download File</a></div>';
  document.getElementById('viewer').classList.add('show');
}
function closeViewer(){const body=document.getElementById('viewerBody');body.querySelectorAll('video,audio').forEach(el=>{el.pause();el.src='';});body.innerHTML='';document.getElementById('viewer').classList.remove('show');}
function downloadFile(url,name){const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();showToast('Downloading: '+name);}
function filterFiles(){renderFiles(document.getElementById('searchInput').value);}
function shareWhatsApp(){const text=encodeURIComponent('Check out '+APP_NAME+'!');const url=WHATSAPP_NUMBER&&WHATSAPP_NUMBER!=='__WHATSAPP_NUMBER__'?'https://wa.me/'+WHATSAPP_NUMBER+'?text='+text:'https://wa.me/?text='+text;window.open(url,'_blank');}
function rateApp(){if(RATE_URL&&RATE_URL!=='__RATE_URL__')window.open(RATE_URL,'_blank');else showToast('Rating coming soon!');}
function openPrivacy(){if(PRIVACY_URL&&PRIVACY_URL!=='__PRIVACY_URL__')window.open(PRIVACY_URL,'_blank');else document.getElementById('privacyModal').classList.add('show');}
function closePrivacy(){document.getElementById('privacyModal').classList.remove('show');}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}
document.getElementById('appTitle').textContent=APP_NAME;
files.forEach(f=>{if(!f.url&&(f.path||f.originalName))f.url='file:///android_asset/webapp/media/'+(f.path||f.originalName);});
updateStats();renderFiles();
console.log(APP_NAME+' loaded - '+files.length+' files');
</script>
</body>
</html>

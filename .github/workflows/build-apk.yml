name: Build APK On-Demand

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App name'
        required: true
        default: 'MyApp'
      media_type:
        description: 'App type (hospital/music/photo/video/any)'
        required: true
        default: 'any'
      engine:
        description: 'Engine (v2 or v3)'
        required: true
        default: 'v2'
      files_b64:
        description: 'Base64-encoded JSON bundle of files'
        required: true
      ai_prompt:
        description: 'AI prompt (if empty, uses files_b64)'
        required: false
        default: ''
      icon_b64:
        description: 'Base64-encoded PNG icon (optional)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install openpyxl pdfplumber PyPDF2 python-docx huggingface_hub
          sudo apt-get update && sudo apt-get install -y default-jdk

      - name: Download tools + engine from HuggingFace
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 - << 'EOF'
          import os, shutil
          from huggingface_hub import hf_hub_download
          repo = "BardomPro/html-to-apk-full-project"
          token = os.environ.get("HF_TOKEN", "") or None
          
          # Build tools
          os.makedirs("backend/build_tools", exist_ok=True)
          for t in ["aapt2", "android.jar", "apksigner", "apksigner-lib.jar", "d8.jar", "debug.keystore"]:
              p = hf_hub_download(repo_id=repo, filename=f"html-to-apk/backend/build_tools/{t}", repo_type="model", token=token)
              shutil.copy2(p, f"backend/build_tools/{t}")
              if t in ("aapt2", "apksigner"): os.chmod(f"backend/build_tools/{t}", 0o755)
              print(f"✓ {t}")
          
          # Engine
          os.makedirs("backend/engine", exist_ok=True)
          engine_files = ["data_analyzer_v2.py","builder_factory_v2.py","template_renderer.py",
              "template_renderer_v3.py","native_bridge.py","admin_renderer.py","firebase_service.py",
              "apk_builder_v3.py","apk_builder.py","build_pipeline.py","config.py",
              "config_json_processor.py","strings_json_processor.py","function_registry.py",
              "project_generator.py","code_extractor.py","component_builder.py","control_builder.py",
              "data_analyzer.py","excel_parser.py","file_builder.py","list_builder.py",
              "math_builder.py","moreblock_builder.py","operator_builder.py","variables_builder.py",
              "view_builder.py","xml_strings_builder.py","z_ai_wrapper.py",
              "core_engine.js","components.js","sw.js","__init__.py"]
          for f in engine_files:
              try:
                  p = hf_hub_download(repo_id=repo, filename=f"apk-generator-system/backend/engine/{f}", repo_type="model", token=token)
                  shutil.copy2(p, f"backend/engine/{f}")
              except: pass
          
          # Templates
          os.makedirs("backend/templates", exist_ok=True)
          for t in ["music_player.html","video_player.html","photo_gallery.html","hospital.html",
                    "pharmacy.html","supermarket.html","store.html","travel.html","transport.html",
                    "catalog.html","file_browser.html"]:
              try:
                  p = hf_hub_download(repo_id=repo, filename=f"apk-generator-system/backend/templates/{t}", repo_type="model", token=token)
                  shutil.copy2(p, f"backend/templates/{t}")
              except: pass
          
          # app_types.json
          try:
              p = hf_hub_download(repo_id=repo, filename="apk-generator-system/backend/app_types.json", repo_type="model", token=token)
              shutil.copy2(p, "backend/app_types.json")
          except: pass
          
          # z.ai config for AI
          try:
              p = hf_hub_download(repo_id=repo, filename="z-ai-sdk/config-real.json", repo_type="model", token=token)
              shutil.copy2(p, "backend/engine/.z-ai-config")
          except: pass
          
          print("✅ All files downloaded!")
          EOF

      - name: Build APK
        id: build
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          INPUT_APP_NAME: ${{ github.event.inputs.app_name }}
          INPUT_MEDIA_TYPE: ${{ github.event.inputs.media_type }}
          INPUT_ENGINE: ${{ github.event.inputs.engine }}
          INPUT_WHATSAPP_URL: https://whatsapp.com/channel/0029VaijFIC5Ejxq4oG6wX0E
          INPUT_FILES_B64: ${{ github.event.inputs.files_b64 }}
          INPUT_AI_PROMPT: ${{ github.event.inputs.ai_prompt }}
          INPUT_ICON_B64: ${{ github.event.inputs.icon_b64 }}
        run: python3 build_apk_action.py

      - name: Upload artifact (backup)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk-${{ github.event.inputs.app_name }}
          path: _output/**/*.apk
          retention-days: 7

      - name: Result
        run: |
          echo "APK: ${{ steps.build.outputs.apk_filename }}"
          echo "Size: ${{ steps.build.outputs.apk_size }} bytes"
          echo "URL: ${{ steps.build.outputs.apk_url }}"

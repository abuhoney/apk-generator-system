<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>qr_generator — QR Generator</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="qr-app">
  <header>
    <h1>QR Generator</h1>
    <p class="meta">Function: <code>qr_generator</code> · v1.0.0</p>
  </header>
  <main>
    <textarea id="qrInput" placeholder="Enter text or URL to encode..." rows="3"></textarea>
    <div class="qr-controls">
      <label>Size: <input type="range" id="qrSize" min="128" max="512" step="32" value="256"></label>
      <span id="sizeLabel">256 px</span>
    </div>
    <div class="qr-actions">
      <button id="btnGenerate">Generate QR</button>
      <button id="btnDownload" class="alt">Download PNG</button>
      <button id="btnCopy" class="alt">Copy Image</button>
    </div>
    <div class="qr-preview" id="qrPreview">
      <div class="qr-empty">Your QR code will appear here</div>
    </div>
    <div class="qr-history">
      <h3>Recent</h3>
      <ul id="qrHistory"></ul>
    </div>
  </main>
  <footer><small>Built by BardomPro APK Generator</small></footer>
</div>
<script src="js/app.js"></script>
</body>
</html>

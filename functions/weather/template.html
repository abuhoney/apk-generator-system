<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ config.function }} — Weather</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="weather-app">
  <header>
    <h1>Weather</h1>
    <p class="meta">Function: <code>{{ config.function }}</code> · v{{ config.version }}</p>
  </header>
  <main>
    <form id="searchForm">
      <input type="text" id="cityInput" placeholder="Enter city name..." autocomplete="off">
      <button type="submit">Search</button>
    </form>
    <div class="weather-card" id="weatherCard" hidden>
      <div class="city" id="city"></div>
      <div class="country" id="country"></div>
      <div class="temp" id="temp"></div>
      <div class="desc" id="desc"></div>
      <div class="icon" id="icon"></div>
      <div class="stats">
        <div><span>Wind</span><b id="wind"></b></div>
        <div><span>Code</span><b id="code"></b></div>
      </div>
    </div>
    <div class="weather-error" id="errorCard" hidden></div>
    <div class="weather-history">
      <h3>Recent searches</h3>
      <ul id="recentList"></ul>
    </div>
  </main>
  <footer><small>Built by BardomPro APK Generator</small></footer>
</div>
<script src="js/app.js"></script>
</body>
</html>
